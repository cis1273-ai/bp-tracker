<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>혈압 기록</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#faf9f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="혈압 기록">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#cc785c;
    --primary-active:#a9583e;
    --primary-disabled:#e6dfd8;
    --ink:#141413;
    --body:#3d3d3a;
    --body-strong:#252523;
    --muted:#6c6a64;
    --muted-soft:#8e8b82;
    --hairline:#e6dfd8;
    --hairline-soft:#ebe6df;
    --canvas:#faf9f5;
    --surface-soft:#f5f0e8;
    --surface-card:#efe9de;
    --surface-cream-strong:#e8e0d2;
    --surface-dark:#181715;
    --on-primary:#ffffff;
    --on-dark:#faf9f5;
    --success:#5db872;
    --warning:#d4a017;
    --error:#c64545;
    --font-display:"Cormorant Garamond","Malgun Gothic",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--canvas);
    color:var(--body);
    padding-bottom:40px;
    overflow-wrap:break-word;
    word-break:keep-all;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:var(--canvas);
    border-bottom:1px solid var(--hairline);
    padding:18px 16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{
    margin:0;
    display:inline;
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    color:var(--ink);
    letter-spacing:-0.3px;
    vertical-align:middle;
  }
  main{max-width:520px;margin:0 auto;padding:16px;}
  .card{
    background:var(--surface-card);
    border-radius:12px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:13px;
    font-weight:500;
    margin:0 0 14px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .row{display:flex;gap:10px;margin-bottom:12px;}
  .row > div{flex:1;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
  input[type=number], input[type=date], input[type=time], input[type=text], textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--hairline);
    border-radius:8px;
    font-size:16px;
    background:var(--canvas);
    color:var(--ink);
    font-family:var(--font-body);
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(204,120,92,0.15);
  }
  textarea{resize:vertical;min-height:44px;font-family:inherit;}
  .btn{
    display:inline-block;
    border:none;
    border-radius:8px;
    padding:12px 16px;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    width:100%;
    font-family:var(--font-body);
  }
  .btn-primary{background:var(--primary);color:var(--on-primary);}
  .btn-primary:active{background:var(--primary-active);}
  .btn-secondary{background:var(--canvas);color:var(--ink);border:1px solid var(--hairline);}
  .btn-secondary:active{background:var(--surface-soft);}
  .btn-flat{background:transparent;color:var(--muted);text-decoration:underline;}
  .form-actions{display:flex;gap:8px;margin-top:16px;}
  .badge{
    display:inline-block;
    padding:2px 10px;
    border-radius:9999px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.3px;
  }
  .badge.high{background:var(--error);color:#fff;}
  .badge.normal{background:var(--surface-cream-strong);color:var(--body-strong);}
  canvas#chart{width:100%;height:180px;display:block;}
  .record{
    border-bottom:1px solid var(--hairline);
    padding:14px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .record:last-child{border-bottom:none;}
  .record-info{flex:1;min-width:0;}
  .record-date{font-size:12px;color:var(--muted);}
  .record-values{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin-top:2px;
    color:var(--ink);
  }
  .record-values span.pulse{font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;}
  .record-memo{font-size:12px;color:var(--muted);margin-top:3px;white-space:normal;overflow-wrap:break-word;word-break:keep-all;}
  .record-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    border:none;background:var(--canvas);border:1px solid var(--hairline);border-radius:8px;
    width:34px;height:34px;font-size:14px;cursor:pointer;
  }
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px;}
  .file-io{display:flex;gap:8px;}
  .file-io .btn{font-size:13px;padding:10px;white-space:nowrap;}
  @media (max-width: 380px){
    .file-io{flex-direction:column;}
    .row-datetime{flex-direction:column;}
  }
  #importFile{display:none;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--surface-dark);color:var(--on-dark);padding:10px 18px;border-radius:9999px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;
    max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;}

  /* --- LCD auto-recognition (added feature, does not affect anything above) --- */
  #lcdPhotoInput{display:none;}
  .lcd-status{
    font-size:13px;
    color:var(--primary-active);
    margin-top:8px;
    display:none;
  }
  .lcd-status.active{display:block;}
  .lcd-preview{
    margin-top:10px;
    max-width:100%;
    border-radius:8px;
    display:none;
    border:1px solid var(--hairline);
  }
  .lcd-hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;overflow-wrap:break-word;word-break:keep-all;}
</style>
</head>
<body>

<header>
  <h1>🩺 혈압 기록</h1>
</header>

<main>

  <div class="card">
    <h2>혈압계 화면 사진으로 자동 인식</h2>
    <input type="file" id="lcdPhotoInput" accept="image/*" capture="environment">
    <button class="btn btn-secondary" id="lcdPhotoBtn">📷 혈압계 LCD 화면 촬영/선택</button>
    <div class="lcd-status" id="lcdStatus"></div>
    <img class="lcd-preview" id="lcdPreview">
    <div class="lcd-hint">오므론 등 SYS/DIA/PULSE 3줄 LCD 화면을 정면에서 찍으면 아래 입력칸에 자동으로 채워져요. 인식된 값은 저장 전 꼭 확인해주세요.</div>
  </div>

  <div class="card">
    <h2 id="formTitle">오늘의 혈압 기록</h2>

    <div class="row row-datetime">
      <div>
        <label>날짜</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label>시간</label>
        <input type="time" id="fTime">
      </div>
    </div>

    <div class="row">
      <div>
        <label>수축기 (mmHg)</label>
        <input type="number" id="fSystolic" placeholder="120" inputmode="numeric">
      </div>
      <div>
        <label>이완기 (mmHg)</label>
        <input type="number" id="fDiastolic" placeholder="80" inputmode="numeric">
      </div>
      <div>
        <label>맥박 (bpm)</label>
        <input type="number" id="fPulse" placeholder="70" inputmode="numeric">
      </div>
    </div>

    <div class="row">
      <div>
        <label>메모 (선택)</label>
        <textarea id="fMemo" placeholder="예: 약 복용 후, 운동 전 등"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" id="saveBtn">저장</button>
      <button class="btn btn-flat" id="cancelEditBtn" style="display:none;">취소</button>
    </div>
  </div>

  <div class="card">
    <h2>최근 추이</h2>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <h2>기록 목록</h2>
    <div id="recordList"></div>
  </div>

  <div class="card">
    <h2>백업</h2>
    <div class="file-io">
      <button class="btn btn-secondary" id="exportBtn">내보내기 (JSON 저장)</button>
      <button class="btn btn-secondary" id="importBtn">가져오기</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "bp_records_v1";
  let records = loadRecords();
  let editingId = null;

  // ---------- storage ----------
  function loadRecords(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveRecords(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      return true;
    }catch(e){
      toast("저장 공간이 부족해요. 백업 후 오래된 기록을 정리해주세요.");
      return false;
    }
  }

  // ---------- helpers ----------
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad(n){ return String(n).padStart(2,"0"); }
  function nowDateStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function nowTimeStr(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  // ---------- form refs ----------
  const fDate = document.getElementById("fDate");
  const fTime = document.getElementById("fTime");
  const fSystolic = document.getElementById("fSystolic");
  const fDiastolic = document.getElementById("fDiastolic");
  const fPulse = document.getElementById("fPulse");
  const fMemo = document.getElementById("fMemo");
  const formTitle = document.getElementById("formTitle");
  const saveBtn = document.getElementById("saveBtn");
  const cancelEditBtn = document.getElementById("cancelEditBtn");

  function resetForm(){
    editingId = null;
    fDate.value = nowDateStr();
    fTime.value = nowTimeStr();
    fSystolic.value = "";
    fDiastolic.value = "";
    fPulse.value = "";
    fMemo.value = "";
    formTitle.textContent = "오늘의 혈압 기록";
    saveBtn.textContent = "저장";
    cancelEditBtn.style.display = "none";
  }
  resetForm();

  // ---------- save / edit / delete ----------
  saveBtn.addEventListener("click", function(){
    const systolic = parseInt(fSystolic.value, 10);
    const diastolic = parseInt(fDiastolic.value, 10);
    const pulse = fPulse.value ? parseInt(fPulse.value, 10) : null;

    if(!fDate.value || !fTime.value){
      toast("날짜와 시간을 입력해주세요");
      return;
    }
    if(!systolic || !diastolic){
      toast("수축기/이완기 값을 입력해주세요");
      return;
    }

    if(editingId){
      const rec = records.find(r => r.id === editingId);
      if(rec){
        rec.date = fDate.value;
        rec.time = fTime.value;
        rec.systolic = systolic;
        rec.diastolic = diastolic;
        rec.pulse = pulse;
        rec.memo = fMemo.value.trim();
      }
      toast("수정되었습니다");
    }else{
      records.push({
        id: uid(),
        date: fDate.value,
        time: fTime.value,
        systolic: systolic,
        diastolic: diastolic,
        pulse: pulse,
        memo: fMemo.value.trim()
      });
      toast("저장되었습니다");
    }

    saveRecords();
    resetForm();
    render();
  });

  cancelEditBtn.addEventListener("click", resetForm);

  function startEdit(id){
    const rec = records.find(r => r.id === id);
    if(!rec) return;
    editingId = id;
    fDate.value = rec.date;
    fTime.value = rec.time;
    fSystolic.value = rec.systolic;
    fDiastolic.value = rec.diastolic;
    fPulse.value = rec.pulse || "";
    fMemo.value = rec.memo || "";
    formTitle.textContent = "기록 수정";
    saveBtn.textContent = "수정 완료";
    cancelEditBtn.style.display = "block";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function deleteRecord(id){
    if(!confirm("이 기록을 삭제할까요?")) return;
    records = records.filter(r => r.id !== id);
    saveRecords();
    if(editingId === id) resetForm();
    render();
  }

  // ---------- rendering ----------
  const recordList = document.getElementById("recordList");

  function sortedRecords(){
    return [...records].sort((a,b) => {
      const da = a.date + " " + a.time;
      const db = b.date + " " + b.time;
      return db.localeCompare(da);
    });
  }

  function render(){
    const sorted = sortedRecords();
    if(sorted.length === 0){
      recordList.innerHTML = '<div class="empty">아직 기록이 없어요. 위에서 첫 혈압을 기록해보세요.</div>';
    }else{
      recordList.innerHTML = sorted.map(rec => {
        const isHigh = rec.systolic >= 140 || rec.diastolic >= 90;
        const badge = isHigh
          ? '<span class="badge high">높음</span>'
          : '<span class="badge normal">정상</span>';
        return `
        <div class="record">
          <div class="record-info">
            <div class="record-date">${rec.date} ${rec.time}</div>
            <div class="record-values">${rec.systolic}/${rec.diastolic} ${badge}
              ${rec.pulse ? `<span class="pulse">맥박 ${rec.pulse}</span>` : ""}
            </div>
            ${rec.memo ? `<div class="record-memo">${escapeHtml(rec.memo)}</div>` : ""}
          </div>
          <div class="record-actions">
            <button class="icon-btn" data-edit="${rec.id}">✏️</button>
            <button class="icon-btn" data-del="${rec.id}">🗑️</button>
          </div>
        </div>`;
      }).join("");
    }
    drawChart(sorted);
  }

  function escapeHtml(s){
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  recordList.addEventListener("click", function(e){
    const editId = e.target.getAttribute("data-edit");
    const delId = e.target.getAttribute("data-del");
    if(editId) startEdit(editId);
    if(delId) deleteRecord(delId);
  });

  // ---------- chart ----------
  function drawChart(sorted){
    const canvas = document.getElementById("chart");
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 480;
    const cssHeight = 180;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssWidth,cssHeight);

    const data = [...sorted].slice(0, 14).reverse(); // oldest to newest, last 14
    if(data.length === 0){
      ctx.fillStyle = "#8e8b82";
      ctx.font = "13px sans-serif";
      ctx.fillText("기록이 쌓이면 그래프가 표시됩니다", 10, cssHeight/2);
      return;
    }

    const padding = {top:14, right:10, bottom:22, left:32};
    const plotW = cssWidth - padding.left - padding.right;
    const plotH = cssHeight - padding.top - padding.bottom;

    const allVals = data.flatMap(d => [d.systolic, d.diastolic]);
    let minV = Math.min(60, ...allVals) - 10;
    let maxV = Math.max(160, ...allVals) + 10;

    function xAt(i){ return padding.left + (data.length===1 ? plotW/2 : (i/(data.length-1))*plotW); }
    function yAt(v){ return padding.top + plotH - ((v-minV)/(maxV-minV))*plotH; }

    // reference lines 120 / 80
    [120,80].forEach(refV => {
      const y = yAt(refV);
      ctx.strokeStyle = "#e6dfd8";
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(cssWidth - padding.right, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#8e8b82";
      ctx.font = "10px sans-serif";
      ctx.fillText(String(refV), 2, y+3);
    });

    function drawLine(key, color){
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((d,i) => {
        const x = xAt(i), y = yAt(d[key]);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
      data.forEach((d,i) => {
        const x = xAt(i), y = yAt(d[key]);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x,y,2.5,0,Math.PI*2);
        ctx.fill();
      });
    }
    drawLine("diastolic", "#e8a55a");
    drawLine("systolic", "#cc785c");

    // x labels (first, middle, last)
    ctx.fillStyle = "#8e8b82";
    ctx.font = "10px sans-serif";
    const labelIdx = data.length > 1 ? [0, data.length-1] : [0];
    labelIdx.forEach(i => {
      const d = data[i];
      const label = d.date.slice(5); // MM-DD
      const x = xAt(i);
      ctx.fillText(label, Math.max(padding.left, Math.min(x-14, cssWidth-30)), cssHeight-4);
    });
  }

  window.addEventListener("resize", () => drawChart(sortedRecords()));

  // ---------- export / import ----------
  document.getElementById("exportBtn").addEventListener("click", function(){
    const blob = new Blob([JSON.stringify(records, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `혈압기록_백업_${nowDateStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("백업 파일이 다운로드되었습니다");
  });

  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", function(){
    const file = this.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const imported = JSON.parse(e.target.result);
        if(!Array.isArray(imported)) throw new Error("invalid format");
        const existingIds = new Set(records.map(r => r.id));
        let added = 0;
        imported.forEach(rec => {
          if(rec && rec.id && !existingIds.has(rec.id)){
            records.push(rec);
            added++;
          }
        });
        saveRecords();
        render();
        toast(`${added}건의 기록을 가져왔습니다`);
      }catch(err){
        toast("파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.");
      }
      importFile.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- init ----------
  render();

  // PWA install support. Requires a secure context (https, or localhost) —
  // silently does nothing when opened directly as a local file:// page.
  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>

<script>
// ---------------------------------------------------------------------------
// LCD auto-recognition (added feature). Fully self-contained: does not read
// or modify anything the script above defines, only reads a photo and, on
// success, writes into the existing #fSystolic/#fDiastolic/#fPulse fields
// for the user to review before saving — same as any manual entry would.
//
// Generic OCR (Tesseract) cannot read seven-segment LCD digits at all — it's
// trained on ordinary typefaces, and segmented digits don't look like any
// letterform it knows, tested and confirmed unusable for this. Instead this
// decodes the display directly:
//   1) find the LCD panel in the photo (its bezel forms a dark ring; the
//      panel interior is the largest area of the photo fully enclosed by
//      dark pixels — i.e. unreachable by flood-filling in from the edges)
//   2) crop to that panel and binarize with local (not global) adaptive
//      thresholding, since the segments are only slightly darker than the
//      panel background and a single global threshold washes them out
//   3) split into rows, then digits within each row, by projecting black
//      pixel counts onto each axis and reading off the gaps
//   4) classify each digit by sampling the seven classic segment zones
//      (a rule-based lookup, not a trained model — segmented digits have an
//      exact geometric definition, so this is more reliable here than OCR)
// ---------------------------------------------------------------------------
(function(){
  "use strict";

  const lcdPhotoInput = document.getElementById("lcdPhotoInput");
  const lcdPhotoBtn = document.getElementById("lcdPhotoBtn");
  const lcdStatus = document.getElementById("lcdStatus");
  const lcdPreview = document.getElementById("lcdPreview");

  if(!lcdPhotoInput || !lcdPhotoBtn) return; // defensive: feature is additive only

  lcdPhotoBtn.addEventListener("click", () => lcdPhotoInput.click());

  lcdPhotoInput.addEventListener("change", function(){
    const file = this.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      lcdPreview.src = e.target.result;
      lcdPreview.style.display = "block";
      runLcdRecognition(e.target.result);
    };
    reader.readAsDataURL(file);
    lcdPhotoInput.value = "";
  });

  function setStatus(msg){
    lcdStatus.textContent = msg;
    lcdStatus.classList.add("active");
    clearTimeout(setStatus._t);
    setStatus._t = setTimeout(() => lcdStatus.classList.remove("active"), 4500);
  }

  function loadImg(src){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function scaledCanvas(img, maxDim){
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    return { canvas, scale };
  }

  // local adaptive threshold via integral image (Bradley's method) — compares
  // each pixel to its neighborhood's mean rather than one global cutoff
  function adaptiveThreshold(canvas, windowFrac, sensitivity){
    const ctx = canvas.getContext("2d");
    const { width, height } = canvas;
    const d = ctx.getImageData(0, 0, width, height).data;
    const n = width * height;
    const gray = new Float64Array(n);
    for(let i = 0, p = 0; i < d.length; i += 4, p++){
      gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    }
    const integral = new Float64Array(n);
    for(let y = 0; y < height; y++){
      let rowSum = 0;
      for(let x = 0; x < width; x++){
        const idx = y*width + x;
        rowSum += gray[idx];
        integral[idx] = rowSum + (y > 0 ? integral[idx-width] : 0);
      }
    }
    const w2 = Math.floor(width * windowFrac / 2);
    const grid = new Uint8Array(n); // 1 = ink (dark), 0 = background
    for(let y = 0; y < height; y++){
      for(let x = 0; x < width; x++){
        const x1 = Math.max(0, x-w2), x2 = Math.min(width-1, x+w2);
        const y1 = Math.max(0, y-w2), y2 = Math.min(height-1, y+w2);
        const area = (x2-x1+1) * (y2-y1+1);
        const A = x1>0 && y1>0 ? integral[(y1-1)*width+(x1-1)] : 0;
        const B = y1>0 ? integral[(y1-1)*width+x2] : 0;
        const C = x1>0 ? integral[y2*width+(x1-1)] : 0;
        const D = integral[y2*width+x2];
        const mean = (D-B-C+A) / area;
        const idx = y*width + x;
        grid[idx] = gray[idx] < mean*(1-sensitivity) ? 1 : 0;
      }
    }
    return { grid, width, height };
  }

  // largest white region unreachable from the image border = the panel interior
  function findLargestEnclosedRegion(grid, width, height){
    const outside = new Uint8Array(width*height);
    const stack = [];
    for(let x=0;x<width;x++){ if(!grid[x]) stack.push(x); const bi=(height-1)*width+x; if(!grid[bi]) stack.push(bi); }
    for(let y=0;y<height;y++){ if(!grid[y*width]) stack.push(y*width); if(!grid[y*width+width-1]) stack.push(y*width+width-1); }
    while(stack.length){
      const idx = stack.pop();
      if(outside[idx]) continue;
      outside[idx] = 1;
      const x = idx%width, y = (idx/width)|0;
      for(const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){
        if(nx<0||ny<0||nx>=width||ny>=height) continue;
        const nidx = ny*width+nx;
        if(!outside[nidx] && !grid[nidx]) stack.push(nidx);
      }
    }
    const visited = new Uint8Array(width*height);
    let best = null;
    for(let start=0; start<width*height; start++){
      if(grid[start] || outside[start] || visited[start]) continue;
      const stack2 = [start]; visited[start] = 1;
      let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity,count=0;
      while(stack2.length){
        const idx = stack2.pop(); count++;
        const x = idx%width, y = (idx/width)|0;
        if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        for(const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){
          if(nx<0||ny<0||nx>=width||ny>=height) continue;
          const nidx = ny*width+nx;
          if(!visited[nidx] && !grid[nidx] && !outside[nidx]){ visited[nidx]=1; stack2.push(nidx); }
        }
      }
      if(!best || count > best.count) best = { minX,maxX,minY,maxY,count };
    }
    return best;
  }

  function removeBorderConnected(grid, width, height){
    const visited = new Uint8Array(width*height);
    const stack = [];
    for(let x=0;x<width;x++){ if(grid[x]) stack.push(x); const bi=(height-1)*width+x; if(grid[bi]) stack.push(bi); }
    for(let y=0;y<height;y++){ if(grid[y*width]) stack.push(y*width); if(grid[y*width+width-1]) stack.push(y*width+width-1); }
    while(stack.length){
      const idx = stack.pop();
      if(visited[idx]) continue;
      visited[idx] = 1;
      const x = idx%width, y = (idx/width)|0;
      for(const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){
        if(nx<0||ny<0||nx>=width||ny>=height) continue;
        const nidx = ny*width+nx;
        if(!visited[nidx] && grid[nidx]) stack.push(nidx);
      }
    }
    const out = new Uint8Array(width*height);
    for(let i=0;i<grid.length;i++) out[i] = (grid[i] && !visited[i]) ? 1 : 0;
    return out;
  }

  function removeSmallBlobs(grid, width, height, minArea){
    const visited = new Uint8Array(width*height);
    const out = new Uint8Array(width*height);
    for(let start=0; start<grid.length; start++){
      if(!grid[start] || visited[start]) continue;
      const stack = [start]; const blob = [];
      visited[start] = 1;
      while(stack.length){
        const idx = stack.pop(); blob.push(idx);
        const x = idx%width, y = (idx/width)|0;
        for(const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1],[x-1,y-1],[x+1,y-1],[x-1,y+1],[x+1,y+1]]){
          if(nx<0||ny<0||nx>=width||ny>=height) continue;
          const nidx = ny*width+nx;
          if(!visited[nidx] && grid[nidx]){ visited[nidx]=1; stack.push(nidx); }
        }
      }
      if(blob.length >= minArea) for(const idx of blob) out[idx] = 1;
    }
    return out;
  }

  function findBands(counts, len, minGap, minSize){
    const bands = [];
    let start = -1, gapRun = 0;
    for(let i=0;i<len;i++){
      if(counts[i] > 0){ if(start === -1) start = i; gapRun = 0; }
      else if(start !== -1){
        gapRun++;
        if(gapRun > minGap){
          const end = i - gapRun;
          if(end-start+1 >= minSize) bands.push([start,end]);
          start = -1; gapRun = 0;
        }
      }
    }
    if(start !== -1){ const end = len-1-gapRun; if(end-start+1 >= minSize) bands.push([start,end]); }
    return bands;
  }

  function tightBox(grid, width, x1, x2, y1, y2){
    let minY=Infinity, maxY=-Infinity, minX=Infinity, maxX=-Infinity;
    for(let y=y1;y<=y2;y++) for(let x=x1;x<=x2;x++){
      if(grid[y*width+x]){ if(y<minY)minY=y; if(y>maxY)maxY=y; if(x<minX)minX=x; if(x>maxX)maxX=x; }
    }
    return [minX,minY,maxX,maxY];
  }

  function segRatio(grid, width, x1, y1, x2, y2){
    let total=0, black=0;
    x1=Math.max(0,Math.round(x1)); y1=Math.max(0,Math.round(y1));
    x2=Math.round(x2); y2=Math.round(y2);
    for(let y=y1;y<y2;y++) for(let x=x1;x<x2;x++){ total++; if(grid[y*width+x]) black++; }
    return total ? black/total : 0;
  }

  const SEG_MAP = {
    "1111110":"0","1101101":"2","1111001":"3","0110011":"4",
    "1011011":"5","1011111":"6","1110000":"7","1111111":"8","1111011":"9"
  };

  function decodeDigit(grid, width, box){
    const [x1,y1,x2,y2] = box;
    const w = x2-x1, h = y2-y1;
    if(h <= 0) return null;
    if(w/h < 0.38) return "1"; // "1" is drawn as a lone narrow stroke — no zones to sample
    const thick = 0.16;
    const a=segRatio(grid,width,x1+w*0.28,y1,x2-w*0.28,y1+h*thick)>0.3;
    const g=segRatio(grid,width,x1+w*0.22,y1+h*0.5-h*thick/2,x2-w*0.22,y1+h*0.5+h*thick/2)>0.3;
    const d=segRatio(grid,width,x1+w*0.28,y2-h*thick,x2-w*0.28,y2)>0.3;
    const f=segRatio(grid,width,x1,y1+h*0.12,x1+w*0.30,y1+h*0.46)>0.28;
    const b=segRatio(grid,width,x2-w*0.30,y1+h*0.12,x2,y1+h*0.46)>0.28;
    const e=segRatio(grid,width,x1,y1+h*0.54,x1+w*0.30,y2-h*0.12)>0.28;
    const c=segRatio(grid,width,x2-w*0.30,y1+h*0.54,x2,y2-h*0.12)>0.28;
    const key = [a,b,c,d,e,f,g].map(v=>v?"1":"0").join("");
    return SEG_MAP[key] || null;
  }

  function recognizeDigitRows(grid, width, height){
    grid = removeBorderConnected(grid, width, height);
    grid = removeSmallBlobs(grid, width, height, Math.round(width*height*0.0005));
    const rowCounts = new Array(height).fill(0);
    for(let y=0;y<height;y++){ let c=0; for(let x=0;x<width;x++) c+=grid[y*width+x]; rowCounts[y]=c; }
    const rowBands = findBands(rowCounts, height, Math.round(height*0.02), Math.round(height*0.04));
    if(rowBands.length === 0) return [];
    const maxRowHeight = Math.max(...rowBands.map(([a,b])=>b-a));
    const rows = [];
    for(const [ry1,ry2] of rowBands){
      const colCounts = new Array(width).fill(0);
      for(let x=0;x<width;x++){ let c=0; for(let y=ry1;y<=ry2;y++) c+=grid[y*width+x]; colCounts[x]=c; }
      const colBands = findBands(colCounts, width, Math.round(width*0.012), Math.round(width*0.015));
      let digits = "";
      let allValid = true;
      for(const [cx1,cx2] of colBands){
        const tb = tightBox(grid, width, cx1, cx2, ry1, ry2);
        const boxH = tb[3]-tb[1];
        if(boxH < maxRowHeight*0.6) continue; // small icon (e.g. an "OK" mark), not a digit
        const d = decodeDigit(grid, width, [tb[0],tb[1],tb[2]+1,tb[3]+1]);
        if(d === null){ allValid = false; break; }
        digits += d;
      }
      if(digits && allValid) rows.push(digits);
    }
    return rows;
  }

  async function runLcdRecognition(dataUrl){
    setStatus("화면 위치를 찾는 중...");
    try{
      const img = await loadImg(dataUrl);

      // stage 1: locate the LCD panel on a small working copy
      const { canvas: smallCanvas, scale: detectScale } = scaledCanvas(img, 1400);
      const { grid: smallGrid, width: sw, height: sh } = adaptiveThreshold(smallCanvas, 0.12, 0.10);
      const region = findLargestEnclosedRegion(smallGrid, sw, sh);

      if(!region || region.count < sw*sh*0.02){
        setStatus("화면 영역을 찾지 못했어요. 혈압계 LCD 화면이 잘 보이도록 정면에서 다시 찍어주세요.");
        return;
      }

      setStatus("숫자를 읽는 중...");

      // map back to full-resolution coordinates, inset slightly inward so the
      // dark bezel ring itself is excluded (it would otherwise fuse with the
      // digit segments during border-blob removal)
      const marginFrac = -0.025;
      const rw = region.maxX - region.minX, rh = region.maxY - region.minY;
      const mx = rw*marginFrac, my = rh*marginFrac;
      const x1 = Math.max(0, (region.minX - mx) / detectScale);
      const y1 = Math.max(0, (region.minY - my) / detectScale);
      const x2 = Math.min(img.width, (region.maxX + mx) / detectScale);
      const y2 = Math.min(img.height, (region.maxY + my) / detectScale);

      const cropW = Math.max(1, Math.round(x2-x1)), cropH = Math.max(1, Math.round(y2-y1));
      const cropCanvas = document.createElement("canvas");
      cropCanvas.width = cropW; cropCanvas.height = cropH;
      cropCanvas.getContext("2d").drawImage(img, x1, y1, cropW, cropH, 0, 0, cropW, cropH);

      // stage 2: re-threshold the crop at higher detail for accurate segment sampling
      const scale2 = Math.min(3, 1600/Math.max(cropW,cropH));
      const w2 = Math.round(cropW*scale2), h2 = Math.round(cropH*scale2);
      const fineCanvas = document.createElement("canvas");
      fineCanvas.width = w2; fineCanvas.height = h2;
      fineCanvas.getContext("2d").drawImage(cropCanvas, 0, 0, w2, h2);
      const { grid: fgrid, width: fw, height: fh } = adaptiveThreshold(fineCanvas, 0.25, 0.05);

      const rows = recognizeDigitRows(fgrid, fw, fh);

      if(rows.length < 2){
        setStatus("숫자를 정확히 읽지 못했어요. 화면이 잘 보이게 다시 찍거나 직접 입력해주세요.");
        return;
      }

      const sys = parseInt(rows[0], 10);
      const dia = parseInt(rows[1], 10);
      const pul = rows[2] ? parseInt(rows[2], 10) : null;

      if(sys) document.getElementById("fSystolic").value = sys;
      if(dia) document.getElementById("fDiastolic").value = dia;
      if(pul) document.getElementById("fPulse").value = pul;

      setStatus("인식 완료! 값을 확인하고 필요하면 수정해주세요.");
    }catch(err){
      console.error(err);
      setStatus("인식 중 문제가 발생했어요. 직접 입력해주세요.");
    }
  }
})();
</script>
